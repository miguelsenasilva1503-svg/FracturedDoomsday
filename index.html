<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FRACTURED DOOMSDAY — Manutenção</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 35%, rgba(52, 152, 219, 0.16), transparent 34%),
        linear-gradient(180deg, #17172a 0%, #0b0b14 100%);
      color: #fff;
    }

    .maintenance {
      width: min(680px, 94vw);
      min-height: min(620px, 90vh);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 42px 28px;
      border: 3px solid #3498db;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(43,43,64,.98), rgba(20,20,34,.98));
      box-shadow:
        0 24px 70px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    .logo {
      margin: 0 0 10px;
      color: #f1c40f;
      font-size: clamp(30px, 7vw, 52px);
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #000;
    }

    .status {
      margin: 0 0 28px;
      color: #8fdcff;
      font-size: clamp(14px, 3vw, 18px);
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .chick {
      width: min(210px, 48vw);
      height: min(210px, 48vw);
      object-fit: contain;
      display: block;
      margin: 6px 0 30px;
      filter: drop-shadow(0 14px 18px rgba(0,0,0,.5));
      animation: float 2.2s ease-in-out infinite;
    }

    .message {
      margin: 0;
      max-width: 560px;
      color: #fff;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 900;
      line-height: 1.25;
      text-shadow: 2px 2px 0 #000;
    }

    .submessage {
      margin: 18px 0 0;
      max-width: 500px;
      color: #b9c4d0;
      font-size: clamp(14px, 3.4vw, 17px);
      line-height: 1.5;
    }

    .dots {
      margin-top: 26px;
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3498db;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: .16s; }
    .dot:nth-child(3) { animation-delay: .32s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: .35; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 480px) {
      .maintenance {
        min-height: 86vh;
        padding: 32px 20px;
        border-radius: 22px;
      }

      .chick {
        margin-bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="maintenance">
    <h1 class="logo">FRACTURED DOOMSDAY</h1>
    <div class="status">MANUTENÇÃO</div>

    <img
      class="chick"
      src="sprites/chick.png"
      alt="Chick"
      draggable="false"
    >

    <p class="message">No momento estamos em manutenção</p>
    <p class="submessage">Aguarde alguns instantes.</p>

    <div class="dots" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </main>
</body>
</html>
